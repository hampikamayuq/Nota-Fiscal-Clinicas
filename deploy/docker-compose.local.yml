# Clínica Fiscal no computador da clínica (ou num servidor da rede local), sem
# HTTPS: API + interface em http://localhost:3100 e PostgreSQL num volume do Docker.
# Uso (na pasta do projeto):
#   docker compose -f deploy/docker-compose.local.yml --env-file .env.local up -d --build
# .env.local: POSTGRES_PASSWORD, AUTH_SECRET, CLINIC_NAME, FISCAL_PROVIDER e os FOCUS_* (docs/deploy.md).
# Para outros computadores da rede acessarem, troque 127.0.0.1 por 0.0.0.0 em `ports`
# — só numa rede confiável: sem HTTPS a senha viaja em claro.
name: clinica-fiscal

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fiscal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em .env.local}
      POSTGRES_DB: fiscal
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiscal -d fiscal"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
    restart: unless-stopped
    env_file: ../.env.local
    environment:
      DATABASE_URL: postgresql://fiscal:${POSTGRES_PASSWORD}@db:5432/fiscal
    volumes:
      - ../empresas:/app/empresas:ro
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db: {}
